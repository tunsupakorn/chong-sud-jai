<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>จุกจิกการค้า</title>
  <meta name="description" content="จุกจิกการค้า บัญชีรายรับรายจ่ายร้านน้ำปั่น อ่านสลิป รายงานกำไร">
  <meta name="theme-color" content="#7CC2FF">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="จุกจิกการค้า">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { var t = JSON.parse(localStorage.getItem('jj_prefs') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <main id="app" class="app"></main>

  <nav class="tabbar" aria-label="เมนูหลัก">
    <button data-nav="home"><span class="ti">🏠</span><span>หน้าหลัก</span></button>
    <button data-nav="stats"><span class="ti">📊</span><span>รายงาน</span></button>
    <button class="fab-wrap" data-nav="sell" aria-label="ขาย"><span class="fab" aria-hidden="true">🛒</span><span>ขาย</span></button>
    <button data-nav="record" aria-label="จดรายจ่าย"><span class="ti">✏️</span><span>จด</span></button>
    <button data-nav="settings"><span class="ti">⚙️</span><span>ตั้งค่า</span></button>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="version.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
