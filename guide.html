<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>วิธีใช้งานจุกจิก</title>
  <meta name="description" content="คู่มือใช้งานจุกจิก JukJik แอปจดรายรับรายจ่าย อ่านสลิป ใบแจ้งยอดบัตรเครดิต งบประมาณ และซิงก์หลายเครื่อง">
  <meta name="theme-color" content="#7CC2FF">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { var t = JSON.parse(localStorage.getItem('jj_prefs') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    .g-top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: max(10px, env(safe-area-inset-top)) 0 10px; display: flex; align-items: center; gap: 10px; }
    .g-top a.icon-btn { display: grid; place-items: center; text-decoration: none; color: var(--text); flex: none; }
    .g-top h1 { font-size: 1.2rem; }
    .g-hero { position: relative; overflow: hidden; border-radius: 26px; padding: 22px; color: #2B2118;
      background: linear-gradient(135deg, #CFE6FF 0%, #DDE4FF 55%, #E6DCFF 100%); box-shadow: 0 12px 32px rgba(47,127,214,.18); }
    .g-hero small { opacity: .8; }
    .g-hero h2 { font-size: clamp(1.4rem, 6vw, 1.9rem); line-height: 1.25; margin: 2px 0 6px; max-width: 70%; }
    .g-hero p { margin: 0; max-width: 68%; font-size: .92rem; }
    .g-hero img { position: absolute; right: -8px; bottom: -10px; width: 120px; height: 120px; border-radius: 30px; transform: rotate(10deg); }
    .g-search { margin-top: 14px; }
    .g-cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 14px; }
    .g-cat { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--text); }
    .g-cat:hover { border-color: var(--accent-2); }
    .g-cat span { font-size: 1.5rem; }
    .g-cat b { font-family: var(--display); font-weight: 500; }
    .g-cat small { color: var(--muted); font-size: .78rem; line-height: 1.35; }
    .g-sec { margin-top: 26px; scroll-margin-top: 70px; }
    .g-sec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .g-sec-head span { width: 44px; height: 44px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; font-size: 1.4rem; flex: none; }
    .g-sec-head h2 { font-size: 1.15rem; }
    .g-sec-head small { display: block; color: var(--muted); font-size: .82rem; }
    .g-list { display: grid; gap: 8px; }
    .g-item { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; scroll-margin-top: 70px; }
    .g-item summary { list-style: none; cursor: pointer; padding: 13px 14px; display: flex; align-items: center; gap: 10px; font-weight: 500; color: var(--text); margin: 0; }
    .g-item summary::-webkit-details-marker { display: none; }
    .g-item summary::after { content: '›'; margin-left: auto; font-size: 1.3rem; color: var(--muted); transition: transform .2s; }
    .g-item[open] summary::after { transform: rotate(90deg); }
    .g-item[open] { border-color: var(--accent-2); }
    .g-body { padding: 0 14px 14px; color: var(--text-2); font-size: .94rem; }
    .g-body p { margin: 0 0 8px; }
    .g-steps { counter-reset: s; list-style: none; margin: 4px 0 8px; padding: 0; display: grid; gap: 8px; }
    .g-steps li { counter-increment: s; display: flex; gap: 10px; align-items: flex-start; }
    .g-steps li::before { content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
      font-weight: 600; font-size: .8rem; display: grid; place-items: center; margin-top: 1px; }
    .g-tip { background: var(--surface-2); border-radius: 12px; padding: 9px 12px; font-size: .88rem; margin-top: 8px; }
    .g-body b { color: var(--text); font-weight: 500; }
    .g-body kbd { font-family: inherit; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; font-size: .85em; white-space: nowrap; }
    .g-empty { text-align: center; color: var(--muted); padding: 30px 10px; }
    .g-cta { margin-top: 26px; text-align: center; }
    mark { background: rgba(255, 200, 61, .45); color: inherit; border-radius: 3px; }
  </style>
</head>
<body class="no-nav">
  <main class="app">
    <header class="g-top">
      <a class="icon-btn" href="./" aria-label="กลับไปที่แอป">‹</a>
      <h1>วิธีใช้งาน</h1>
    </header>

    <section class="g-hero">
      <small>คู่มือจุกจิก</small>
      <h2>จุกจิกทำอะไรได้บ้าง?</h2>
      <p>อ่านสลิป จดบัตรเครดิต ตั้งงบ ดูสรุป และซิงก์ทุกเครื่อง ครบในแอปเดียว</p>
      <img src="icons/icon.svg" alt="">
    </section>

    <label class="search g-search"><span aria-hidden="true">🔍</span>
      <input type="search" id="q" placeholder="ค้นหาวิธีใช้ เช่น สลิป, งบ, ซิงก์" autocomplete="off"></label>

    <nav class="g-cats" id="cats" aria-label="หมวดคู่มือ"></nav>
    <div id="sections"></div>
    <p class="g-empty" id="empty" hidden>ไม่พบหัวข้อที่ค้นหา ลองใช้คำอื่นดูนะ</p>

    <section class="g-cta">
      <a class="btn primary big" href="./">กลับไปจดเลย 🐣</a>
    </section>
    <p class="center muted small pad">จุกจิก JukJik</p>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

    { id: 'banks', q: 'รองรับสลิปจากแอปไหนบ้าง?', body:
      '<p>อ่านได้<b>ทุกธนาคาร</b> เพราะใช้ AI อ่านจากรูป ไม่ได้จำกัดเฉพาะบางแอป เช่น K PLUS, SCB EASY, Krungthai NEXT, Bangkok Bank, krungsri, ttb, GSB, พร้อมเพย์ และ e-wallet ที่มีหน้าสลิป</p><p>รวมถึงใบเสร็จร้านค้าที่ถ่ายรูปมาด้วย</p>' },
    { id: 'last30', q: 'เลือกเฉพาะสลิป 30 วันล่าสุด', body:
      '<p>ถ้าติ๊ก <b>เลือกเฉพาะสลิป 30 วันล่าสุดให้อัตโนมัติ</b> ไว้ (ค่าเริ่มต้น) สลิปที่เก่ากว่า 30 วันจะขึ้นป้าย <b>เกิน 30 วัน</b> และไม่ถูกเลือกไว้</p><p>ถ้าต้องการบันทึกสลิปเก่าด้วย ให้ติ๊กเลือกรายการนั้นเอง หรือเอาเครื่องหมายช่องนี้ออก</p>' },
    { id: 'dup', q: 'สลิปซ้ำ จะถูกบันทึกสองครั้งไหม?', body:
      '<p>ไม่ จุกจิกเช็กซ้ำ 2 ชั้น:</p><ul><li><b>QR บนสลิป</b> – อ่านในเครื่องฟรี ได้เลขอ้างอิงจริงของธนาคาร ถ้าเคยบันทึกแล้วจะ<b>ข้ามทันทีโดยไม่ส่งให้ Gemini</b> (ไม่เสียโควตา ไม่เสียเวลา)</li><li><b>ข้อมูลในสลิป</b> – เลขอ้างอิง วันที่ เวลา ยอด และผู้รับ ถ้าตรงกับที่มีอยู่จะขึ้นป้ายสีส้ม <b>ซ้ำ</b> และไม่ถูกเลือกไว้</li></ul>' },
    { id: 'qr', q: 'ป้าย ✓ QR คืออะไร?', body:
      '<p>แปลว่าจุกจิกอ่าน QR บนสลิปได้ และได้<b>เลขอ้างอิงจากธนาคารโดยตรง</b> (แม่นยำ 100%) ใช้กันสลิปซ้ำได้แน่นอน ส่วนยอดเงินและชื่อยังอ่านด้วย Gemini เพราะ QR บนสลิปไม่มียอดเงิน</p><p>สลิปที่ไม่มีป้ายนี้ก็ยังบันทึกได้ปกติ เช่น ภาพถูกครอปจน QR หาย ภาพเบลอ หรือเป็นใบเสร็จร้านค้า</p>' },
    { id: 'review', q: 'แก้ไขก่อนบันทึก', body:
      '<p>ในหน้า <b>ตรวจก่อนบันทึก</b> แต่ละรายการแก้ได้ทันที:</p><ul><li>ประเภท รายจ่าย / รายรับ</li><li>จำนวนเงิน</li><li>หมวดหมู่</li><li>วันที่</li></ul><p>รายการที่ไม่ต้องการ ให้เอาเครื่องหมายถูกออก แล้วกดบันทึก ถ้าอยากเริ่มใหม่ทั้งหมด กด <b>ล้าง</b></p>' },
    { id: 'slip-fail', q: 'อ่านสลิปไม่สำเร็จ ทำอย่างไร?', body:
      '<p>ดูข้อความในกรอบสีแดงใต้ปุ่มเลือกไฟล์:</p><ul><li><b>API key ไม่ถูกต้อง</b> – ใส่ key ใหม่ในตั้งค่า</li><li><b>ใช้เกินโควตาฟรีชั่วคราว</b> – รอสักครู่แล้วลองใหม่</li><li><b>ไม่พบรายการเงินในไฟล์นี้</b> – รูปอาจไม่ใช่สลิป หรือภาพไม่ชัด</li><li><b>โมเดลใช้ไม่ได้แล้ว</b> – โดยปกติแอปจะเปลี่ยนรุ่นให้เอง ถ้าไม่หาย ให้แก้ช่อง <b>โมเดล</b> ในตั้งค่า</li><li><b>Gemini ตอบช้าเกินไป</b> – เซิร์ฟเวอร์ยุ่ง แอปจะหยุดเองภายใน 2 นาที กด <b>ลองอ่านไฟล์เหล่านี้อีกครั้ง</b> หรือกด <b>ยกเลิก</b> ระหว่างรอได้</li></ul>' },
    { id: 'model', q: 'เปลี่ยนรุ่น Gemini (Flash-Lite / Flash)', body:
      '<p>ค่าเริ่มต้นคือรุ่น <b>Flash-Lite</b> ตอบเร็ว และอ่านสลิปทั่วไปได้ดี ถ้าอยากได้ความแม่นยำมากขึ้น เช่น ใบแจ้งยอดบัตรเครดิตหลายหน้า เปลี่ยนเป็นรุ่น Flash ได้ที่ <b>⚙️ ตั้งค่า</b> › <b>Gemini</b> › ช่อง <b>โมเดล</b> (เช่น ลบคำว่า <kbd>-lite</kbd> ออก)</p><p>ถ้าใส่ชื่อรุ่นที่ไม่มีอยู่จริง แอปจะหารุ่นที่ใช้ได้แล้วเปลี่ยนให้เอง</p>' },
  ]},
  { id: 'card', icon: '💳', title: 'จดบัตรเครดิต', sub: 'อ่านใบแจ้งยอดให้ทั้งฉบับ', items: [
    { id: 'statement', q: 'อัปโหลดใบแจ้งยอดบัตรเครดิต', steps: [
      'ดาวน์โหลดใบแจ้งยอด (e-Statement) เป็นไฟล์ <b>PDF</b> จากอีเมลหรือแอปธนาคาร',
      'กดปุ่มเหลือง <b>🧾 อ่านสลิป</b> ตรงกลางด้านล่าง แล้วเลือกไฟล์ PDF',
      'จุกจิกจะแยกทุกรายการในใบแจ้งยอดออกมาให้ตรวจ',

      tip: 'ใบแจ้งยอดแบบกระดาษก็ใช้ได้ ถ่ายรูปทีละหน้าแล้วเลือกพร้อมกันหลายรูป' },
    { id: 'pdf-password', q: 'PDF ใบแจ้งยอดมีรหัสผ่าน', steps: [
      'เปิด PDF ในเครื่อง แล้วใส่รหัส (มักเป็นวันเดือนปีเกิด)',
      'สั่ง <b>พิมพ์</b> แล้วเลือก <b>บันทึกเป็น PDF</b> จะได้ไฟล์ใหม่ที่ไม่มีรหัส',
      'เลือกไฟล์ใหม่นั้นในจุกจิก'] },
    { id: 'card-rules', q: 'จุกจิกจดรายการบัตรอย่างไร?', body:
      '<ul><li><b>รายการซื้อ</b> → รายจ่าย ช่องทางบัตร</li><li><b>ยอดผ่อน</b> (เช่น 3/10) → รายจ่าย พร้อมโน้ตงวดผ่อน</li><li><b>ดอกเบี้ย / ค่าธรรมเนียม</b> → หมวด 🧾 ค่าธรรมเนียม/ดอกเบี้ย</li><li><b>เงินคืน / Cashback / คืนเงิน</b> → รายรับ หมวด 🔁 เงินคืน</li><li><b>ยอดที่คุณจ่ายคืนบัตร</b> → ไม่นับ เพื่อไม่ให้รายจ่ายซ้ำกับรายการซื้อ</li></ul>' },
  ]},
  { id: 'manual', icon: '✍️', title: 'จดเพิ่มเอง', sub: 'สำหรับรายการไม่มีสลิป', items: [
    { id: 'add-cash', q: 'จดรายจ่ายเงินสด', steps: [
      'กด <b>✏️ จดเอง</b> ที่แถบเมนูด้านล่าง (ข้างปุ่มเหลือง)',
      'ใส่จำนวนเงิน',
      'เลือกหมวด เช่น 🍜 อาหาร',
      'เลือกวันที่และช่องทาง (เงินสด / โอน / บัตร) ใส่โน้ตถ้าต้องการ',
      'กด <b>บันทึก</b>'] },
    { id: 'add-income', q: 'จดรายรับ', steps: ['กด <b>✏️ จดเอง</b>', 'แตะแท็บ <b>รายรับ</b> ด้านบน', 'ใส่ยอด เลือกหมวด เช่น 💼 เงินเดือน แล้วกด <b>บันทึก</b>'] },
    { id: 'transfer', q: 'ย้ายเงินระหว่างบัญชีตัวเอง', body:
      '<p>รายการ <b>🔄 ย้ายเงิน</b> คือเงินที่แค่ย้ายที่ เช่น โอนจากบัญชี A ไปบัญชี B ของคุณเอง เติมเงินเข้า e-wallet ตัวเอง หรือชำระบัตรเครดิต รายการแบบนี้<b>ไม่นับเป็นรายรับหรือรายจ่าย</b> ยอดคงเหลือจึงไม่เพี้ยน</p><ul><li><b>อ่านจากสลิป:</b> ถ้าชื่อผู้โอนกับผู้รับเป็นคนเดียวกัน (เช่น “นายศุภกร น***” → “นายศุภกร นิตยวรรณ”) จุกจิกจะจดเป็นย้ายเงินให้เอง พร้อมเลขบัญชีต้นทางและปลายทาง</li><li><b>จดเอง:</b> กด <b>✏️ จดเอง</b> แล้วเลือกแท็บ <b>ย้ายเงิน</b></li><li>ถ้าสลิปมีค่าธรรมเนียม จะแยกเป็นรายจ่ายหมวด 🧾 ค่าธรรมเนียม อีกรายการ</li></ul><p class="g-tip">💡 ใส่ชื่อ-นามสกุลของคุณที่ <b>⚙️ ตั้งค่า</b> › <b>Gemini</b> เพื่อให้แยกได้แม่นขึ้น ถ้าชำระบัตรเครดิตแต่ไม่ได้นำเข้าใบแจ้งยอด ให้เปลี่ยนรายการนั้นเป็น “รายจ่าย” ตอนตรวจก่อนบันทึก</p>' },
    { id: 'bills', q: 'อ่านใบเสร็จค่าน้ำ ค่าไฟ อินเทอร์เน็ต ค่าโทรศัพท์', body:
      '<p>ส่งรูปใบเสร็จหรือสลิปชำระบิลมาได้เลย จุกจิกจะจัดเข้าหมวดให้: ⚡ ค่าไฟ (MEA/PEA), 🚰 ค่าน้ำ (กปน./กปภ.), 🌐 อินเทอร์เน็ต (3BB, AIS Fibre, True), 📱 ค่าโทรศัพท์ (AIS, True, dtac) พร้อมเลขที่ผู้ใช้ไฟ/เบอร์โทร และรอบบิลในโน้ต</p>' },
    { id: 'edit', q: 'แก้ไขหรือลบรายการ', steps: ['ในหน้าหลัก แตะรายการที่ต้องการ', 'แก้ข้อมูลแล้วกด <b>บันทึก</b>', 'ถ้าจะลบ กด <b>ลบ</b> แล้วยืนยัน'] },
  ]},
  { id: 'track', icon: '🗂️', title: 'ติดตามการใช้จ่าย', sub: 'ค้นหา ย้อนดู จัดหมวด', items: [
    { id: 'search', q: 'ค้นหารายการ', body: '<p>ในหน้าหลัก พิมพ์ในช่อง <b>🔍 ค้นหารายการ</b> ค้นได้ทั้งชื่อหมวด ชื่อร้าน/ผู้รับ โน้ต และจำนวนเงิน</p>' },
    { id: 'months', q: 'ดูรายการเดือนก่อนๆ', body: '<p>กดลูกศร <kbd>‹</kbd> <kbd>›</kbd> ข้างชื่อเดือน ใช้ได้ทั้งหน้าหลักและหน้าสรุป</p>' },
    { id: 'new-cat', q: 'เพิ่มหมวดหมู่ใหม่', steps: ['ไปที่ <b>⚙️ ตั้งค่า</b> › <b>หมวดหมู่</b>', 'กด <b>+ เพิ่มหมวดรายจ่าย</b> หรือ <b>+ เพิ่มหมวดรายรับ</b>', 'ตั้งชื่อ เลือกอีโมจิจากตาราง (หรือพิมพ์เอง) แล้วกด <b>เพิ่มหมวด</b>'] },
    { id: 'edit-cat', q: 'แก้ชื่อ อีโมจิ หรือลำดับหมวด', steps: ['ไปที่ <b>⚙️ ตั้งค่า</b> › <b>หมวดหมู่</b> แล้วแตะหมวดที่ต้องการ', 'แก้ชื่อหรือเลือกอีโมจิใหม่', 'กด <b>‹ เลื่อนก่อน</b> / <b>เลื่อนหลัง ›</b> เพื่อจัดลำดับ หมวดที่อยู่ก่อนจะขึ้นก่อนตอนจด', 'กด <b>บันทึก</b>'] },
    { id: 'del-cat', q: 'ลบหมวดหมู่', body: '<p>แตะหมวดแล้วกด <b>ลบหมวด</b> ลบได้ทุกหมวด รวมถึงหมวดเริ่มต้น (ต้องเหลืออย่างน้อย 1 หมวดต่อประเภท) รายการเก่าในหมวดนั้นจะ<b>ย้ายไปหมวด “อื่นๆ”</b> ให้อัตโนมัติ ไม่หาย</p><p>ถ้าลบหมวดเริ่มต้นไปแล้วอยากได้คืน กด <b>↺ คืนหมวดเริ่มต้นที่ลบไป</b> ท้ายการ์ดหมวดหมู่</p>' },
  ]},
  { id: 'budget', icon: '🎯', title: 'วางแผนการเงิน', sub: 'ตั้งงบ คุมรายจ่าย', items: [
    { id: 'set-budget', q: 'ตั้งงบรายเดือน', steps: ['ไปที่ <b>⚙️ ตั้งค่า</b> › <b>งบประมาณรายเดือน</b>', 'ใส่ยอด เช่น 15000', 'กด <b>บันทึก</b> หน้าหลักจะมีการ์ดงบขึ้นมา'] },
    { id: 'read-budget', q: 'อ่านการ์ดงบ', body:
      '<ul><li><b>แถบสีเหลือง</b> – ยังอยู่ในงบ</li><li><b>แถบสีส้ม</b> – ใช้ไปเกิน 80%</li><li><b>แถบสีแดง</b> – ใช้เกินงบแล้ว พร้อมบอกยอดที่เกิน</li></ul><p>ในเดือนปัจจุบัน การ์ดจะบอกด้วยว่าเหลือ <b>ใช้ได้วันละเท่าไหร่</b> จนถึงสิ้นเดือน</p>' },
    { id: 'off-budget', q: 'ปิดการแสดงงบ', body: '<p>ใส่ <b>0</b> ในช่องงบแล้วกดบันทึก</p>' },
  ]},
  { id: 'summary', icon: '📊', title: 'ดูสรุป', sub: 'เห็นภาพรวมทันที', items: [
    { id: 'monthly', q: 'สรุปรายเดือน', body: '<p>แท็บ <b>📊 สรุป</b> สลับดูได้ทั้ง <b>รายจ่าย</b> และ <b>รายรับ</b> มีตัวเลขรวมทั้งเดือน เฉลี่ยต่อวัน และจำนวนรายการ</p>' },
    { id: 'daily-chart', q: 'กราฟรายวัน', body: '<p>แตะหรือชี้ที่แท่งกราฟ เพื่อดูยอดของวันนั้น</p>' },
    { id: 'by-cat', q: 'สรุปแยกหมวด และช่องทาง', body: '<p>เรียงหมวดจากใช้มากไปน้อย พร้อมเปอร์เซ็นต์ ด้านล่างมีสรุปตามช่องทาง เงินสด / โอน / บัตร</p>' },
  ]},
  { id: 'account', icon: '🔄', title: 'ซิงก์และข้อมูล', sub: 'หลายเครื่อง สำรอง ส่งออก', items: [
    { id: 'sync', q: 'ซิงก์หลายเครื่อง', body: '<p>ล็อกอินบัญชีเดียวกันในทุกเครื่อง รายการที่จดในเครื่องหนึ่งจะขึ้นในเครื่องอื่นภายในไม่กี่วินาที</p>' },
    { id: 'sync-status', q: 'ความหมายของจุดสีมุมขวาบน', body:
      '<ul><li>🟢 <b>ซิงก์แล้ว</b> – ข้อมูลตรงกันทุกเครื่อง</li><li>🟡 <b>กำลังซิงก์…</b> – กำลังส่งข้อมูล หรือยังออฟไลน์อยู่</li><li>🟠 <b>ยังไม่ล็อกอิน</b> – ข้อมูลอยู่แค่ในเครื่องนี้</li><li>🔴 <b>ซิงก์ผิดพลาด</b> – แตะเพื่อดูสาเหตุในหน้าตั้งค่า</li></ul>' },
    { id: 'upload-local', q: 'จดไว้ก่อนล็อกอิน จะหายไหม?', body: '<p>ไม่หาย หลังล็อกอิน หน้าหลักจะถามว่า <b>อัปขึ้นบัญชี</b> ไหม กดอัปขึ้นบัญชี แล้วรายการจะไปอยู่ในบัญชีและซิงก์ทุกเครื่อง</p>' },
    { id: 'backup', q: 'สำรองข้อมูล / ส่งออกเป็น Excel', body:

    { id: 'sheet-what', q: 'ดูข้อมูลใน Google Sheet', body:

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const strip = html => html.replace(/<[^>]+>/g, ' ');

function itemHTML(it) {
  const body = (it.steps ? `<ol class="g-steps">${it.steps.map(s => `<li><span>${s}</span></li>`).join('')}</ol>` : '')
    + (it.body || '') + (it.tip ? `<p class="g-tip">💡 ${it.tip}</p>` : '');
  return `<details class="g-item" id="${it.id}"><summary>${it.q}</summary><div class="g-body">${body}</div></details>`;
}

function render(q = '') {
  const needle = q.trim().toLowerCase();
  const match = it => !needle || (it.q + ' ' + strip(it.body || '') + ' ' + (it.steps || []).map(strip).join(' ') + ' ' + (it.tip || '')).toLowerCase().includes(needle);
  let any = false;
  $('#sections').innerHTML = GUIDE.map(sec => {
    const items = sec.items.filter(match);
    if (!items.length) return '';
    any = true;
    return `<section class="g-sec" id="sec-${sec.id}">
      <div class="g-sec-head"><span aria-hidden="true">${sec.icon}</span><div><h2>${sec.title}</h2><small>${sec.sub}</small></div></div>
      <div class="g-list">${items.map(itemHTML).join('')}</div></section>`;
  }).join('');
  $('#empty').hidden = any;
  $('#cats').hidden = !!needle;
  if (needle) document.querySelectorAll('.g-item').forEach(d => d.open = true);
}

$('#cats').innerHTML = GUIDE.map(s => `<a class="g-cat" href="#sec-${s.id}"><span aria-hidden="true">${s.icon}</span><b>${s.title}</b><small>${s.sub}</small></a>`).join('');
render();
$('#q').addEventListener('input', e => render(e.target.value));

// open a topic from a #link
function openHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  const el = id && document.getElementById(id);
  if (el && el.tagName === 'DETAILS') { el.open = true; setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50); }
}
window.addEventListener('hashchange', openHash);
openHash();
</script>
